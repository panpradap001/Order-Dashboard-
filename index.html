<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Order Dashboard</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>My Panel</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="view-dashboard">
          <span>สรุปออเดอร์รวม</span>
        </button>
        <button class="nav-item" data-view="view-store">
          <span>ข้อมูลร้านค้า</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      
      <!-- Dashboard View -->
      <div id="view-dashboard" class="view-section active">
        <div class="app-container">
          <!-- Header Section -->
          <header class="dashboard-header">
            <div class="header-title">
              <h1>Order Dashboard</h1>
              <p class="subtitle">Live updates from Google Sheet</p>
            </div>
            
            <!-- Controls -->
            <div class="controls-wrapper">
              <div class="controls-top">
                
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <div class="control-group toggle-group" style="margin-bottom: 0;">
                    <label class="toggle-switch">
                      <input type="checkbox" id="active-only-toggle" checked>
                      <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">แสดงเฉพาะสินค้าที่มีออเดอร์</span>
                  </div>
                  
                  <div class="control-group toggle-group" style="margin-bottom: 0;">
                    <label class="toggle-switch">
                      <input type="checkbox" id="stock-only-toggle">
                      <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">แสดงเฉพาะสินค้าที่มีสต็อก</span>
                  </div>
                </div>
                
                <div class="control-group">
                  <label>หมวดหมู่ (Category)</label>
                  <div class="multi-select-container" id="category-multi-select">
                    <div class="multi-select-header" id="category-filter-header">
                      ทั้งหมด (All Categories)
                    </div>
                    <div class="multi-select-options-wrapper" id="category-filter-dropdown">
                      <div class="category-search-wrapper">
                        <input type="text" id="category-search" placeholder="ค้นหาหมวดหมู่...">
                      </div>
                      <div class="multi-select-options" id="category-filter-options">
                        <!-- Dynamically populated by JS -->
                      </div>
                    </div>
                  </div>
                </div>
                
                <div class="control-group" style="margin-left: auto;">
                  <button id="presentation-btn" class="btn-primary">Presentation Mode</button>
                </div>
              </div>
            </div>
          </header>

          <!-- Main Dashboard Area -->
          <main>
            <div id="loading-spinner" class="loading">Loading data...</div>
            <div id="dashboard-container" class="dashboard-grid">
              <!-- Tables will be dynamically injected here by JS -->
            </div>
          </main>
        </div>
      </div>

      <!-- Store Info View -->
      <div id="view-store" class="view-section" style="display: none;">
        <div class="app-container">
          
          <!-- Store List Sub-view -->
          <div id="view-store-list">
            <header class="dashboard-header">
              <div class="header-title">
                <h1>ข้อมูลร้านค้า</h1>
                <p class="subtitle">รายชื่อลูกค้าที่มีรายการสั่งซื้อ</p>
              </div>
              <div class="controls-wrapper">
                <div class="controls-top">
                  <div class="control-group" style="margin-left: auto;">
                    <label>ค้นหาร้านค้า (Search Store)</label>
                    <input type="text" id="store-search" placeholder="พิมพ์ชื่อร้านค้าที่ต้องการค้นหา..." style="width: 300px;">
                  </div>
                </div>
              </div>
            </header>
            <main>
              <div id="store-list-container" class="dashboard-grid store-grid">
                <!-- Store cards dynamically injected -->
              </div>
            </main>
          </div>

          <!-- Store Detail Sub-view -->
          <div id="view-store-detail" style="display: none;">
            <header class="dashboard-header">
              <div class="header-title">
                <h1 id="store-detail-title">ชื่อร้านค้า</h1>
                <p class="subtitle">รายการสั่งซื้อของลูกค้า</p>
              </div>
              <div class="controls-wrapper">
                <div class="controls-top">
                  <button id="back-to-store-list" class="btn-primary" style="margin-left: auto;">← ย้อนกลับ</button>
                </div>
              </div>
            </header>
            <main>
              <div id="store-detail-container">
                <!-- Detailed table dynamically injected -->
              </div>
            </main>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- App Logic & External Libs -->
  <script type="module" src="app.js"></script>
</body>
</html>
